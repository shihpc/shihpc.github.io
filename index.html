<style>
  :root{
    --bg:#0b1120;
    --bg2:#111a2e;
    --card:#16213a;

<script>
/* ===== 密碼門(輕量遮罩,非真正安全)=====
   PW_HASH = SHA-256("你的密碼")。要改密碼:重算雜湊換掉這行即可。 */
const PW_HASH = "1155b0007068f8e930964e11ee161fe2958854fa8c82746890802b8ec38c9e67";
const AUTH_KEY = "radar_auth";

async function sha256(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
function unlock(){
  document.body.classList.remove("locked");
  document.getElementById("gate").remove();
  renderCards();
  loadStatus(); // 解鎖後才抓資料健康狀態(未解鎖不發請求;失敗顯示「查詢失敗(未知)」)
  loadMyChanges(); // 解鎖後才讀本機持股並抓 taiwan-flows latest.json(無持股則整節不出現)
}

/* ────────────────────────────────────────────────
   新增專案:在這個陣列加一筆即可。
   - name / desc / url 必填
   - icon  可選,對應下方 ICONS 的 key(預設 chart)
   - color 可選,不填會自動依順序分配
   ──────────────────────────────────────────────── */
const PROJECTS = [
  {
    name: "即時類股動態",
    desc: "秒級即時 · Cloudflare 加速 · 自動刷新",
    url:  "https://shihpc.github.io/taiwan-flow-live-v2/",
    icon: "bolt",
    color: ["#0f3a3a", "#06b6d4"], // 青:標示「即時 / 快」
    statusId: "live",
  },
  {
    name: "盤後法人動態",
    desc: "外資 / 投信 / ETF 進出與資金流動",
    url:  "https://shihpc.github.io/taiwan-flows/",
    icon: "flow",
    color: ["#14532d", "#16a34a"], // 綠(釘原色,不受新卡位移影響)
    statusId: "flows",
  },
  {
    name: "新聞晨報",
    desc: "個股新聞 · 開盤前晨報（期指/美股/籌碼）",
    url:  "https://shihpc.github.io/taiwan-stock-news/",
    icon: "news",
    color: ["#4a2c0f", "#f59e0b"], // 橙:標示「新聞 / 資訊」
    statusId: "news",
  },
  {
    name: "盤後分析",
    desc: "主動ETF · 融資借券 · 當沖 · 鉅額交易",
    url:  "https://shihpc.github.io/postmkt/",
    icon: "chart",
    color: ["#3b2168", "#8b5cf6"], // 紫:標示「盤後 / 分析」
    statusId: "postmkt",
  },
  {
    name: "策略回測",
    desc: "小台日內策略 · Playbook v3 · 每日前推對帳",
    url:  "https://shihpc.github.io/taiwan-backtest/",
    icon: "radar",
    color: ["#1e3a5f", "#2563eb"], // 藍:標示「回測 / 驗證」
  },
];

/* 漸層色盤:專案多於色盤時自動循環 */
const PALETTE = [
  ["#1e3a5f", "#2563eb"], // 藍
  ["#14532d", "#16a34a"], // 綠
  ["#5b2150", "#db2777"], // 粉
  ["#4a2c0f", "#f59e0b"], // 橙
  ["#3b2168", "#8b5cf6"], // 紫
  ["#0f3a3a", "#06b6d4"], // 青
];

/* ICON 圖庫:要新增圖示就在這裡加一個 key → SVG 內容 */
const ICONS = {
  chart: '<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>',
  flow:  '<path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="9"/>',
  radar: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 13l2 2 5-5"/>',
  bolt:  '<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>',
  news:  '<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v9a2 2 0 0 1-2 2"/><path d="M8 9h6M8 12h6M8 15h4"/>',
};

function renderCards(){
  const grid = document.getElementById("grid");
  PROJECTS.forEach((p, i) => {
    const [c1, c2] = p.color || PALETTE[i % PALETTE.length];
    const svg = ICONS[p.icon] || ICONS.chart;
    const a = document.createElement("a");
    a.className = "card";
    a.href = p.url;
    a.innerHTML =
      '<div class="icon" style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ')">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + svg + '</svg>' +
      '</div>' +
      '<h2></h2><p></p>';
    a.querySelector("h2").textContent = p.name;
    a.querySelector("p").textContent  = p.desc;
    if (p.statusId) a.dataset.statusId = p.statusId; // 供狀態列比對 /status 的 sites[].id
    grid.appendChild(a);
  });
}

/* ===== 資料健康狀態列 =====
   解鎖後向 Worker 抓 /status,逐卡顯示「● 資料日 MM/DD」;
   fetch 失敗、逾時(8 秒)、非 2xx 或 JSON 不合形狀 → 卡片不掛狀態列,
   改在 #statusMsg 顯示中性灰「資料狀態:查詢失敗(未知)」,讓使用者分得出
   「查不到」與「一切正常」;若 localStorage 有上次成功時間則附「上次成功 MM/DD HH:MM」。
   成功時把 ISO 時間寫進 localStorage key hub_status_ok_at(存取皆 try/catch,不可用就略過)。 */
const STATUS_URL = "https://taiwan-flow-v2.shihpc.workers.dev/status";
const STATUS_LEVELS = { green: 1, yellow: 2, red: 3 }; // 數字越大越差
const STATUS_OK_KEY = "hub_status_ok_at";

function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* 私密模式/配額/被封鎖:略過 */ } }

function pad2(n){ return String(n).padStart(2, "0"); }
function showStatusFail(){
  const el = document.getElementById("statusMsg");
  if (!el) return;
  let text = "資料狀態:查詢失敗(未知)";
  const iso = lsGet(STATUS_OK_KEY);
  const t = iso ? new Date(iso) : null;
  if (t && !isNaN(t.getTime())) {
    text += " · 上次成功 " + pad2(t.getMonth() + 1) + "/" + pad2(t.getDate()) +
            " " + pad2(t.getHours()) + ":" + pad2(t.getMinutes());
  }
  el.textContent = text;
  el.hidden = false;
}

async function loadStatus(){
  let data;
  try {
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000); // 逾時 8 秒即放棄
    const res   = await fetch(STATUS_URL, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return showStatusFail();
    data = await res.json();
    if (!data || !Array.isArray(data.sites)) return showStatusFail();
  } catch (e) {
    /* 網路失敗、逾時中斷、JSON 解析失敗:不拋錯,改顯示「查詢失敗(未知)」 */
    return showStatusFail();
  }
  lsSet(STATUS_OK_KEY, new Date().toISOString()); // 形狀合格才算成功

  try {
    // 建 id → site 索引(略過形狀不對的項目)
    const byId = {};
    data.sites.forEach(s => { if (s && typeof s.id === "string") byId[s.id] = s; });

    document.querySelectorAll("#grid .card[data-status-id]").forEach(card => {
      const site = byId[card.dataset.statusId];
      if (!site || !STATUS_LEVELS[site.level] || typeof site.data_date !== "string") return;
      const m = site.data_date.match(/^\d{4}-(\d{2})-(\d{2})$/);
      if (!m) return;

      let level = site.level;
      let title = (site.note || "") + (site.updated_at ? "\n更新於 " + site.updated_at : "");

      // 新聞卡另併入晨報(brief)狀態:取兩者較差級,並在 title 註明晨報狀態
      if (card.dataset.statusId === "news") {
        const brief = byId.brief;
        if (brief && STATUS_LEVELS[brief.level]) {
          if (STATUS_LEVELS[brief.level] > STATUS_LEVELS[level]) level = brief.level;
          title += "\n晨報:" + brief.level + (brief.note ? " · " + brief.note : "");
        }
      }

      const div = document.createElement("div");
      div.className = "status";
      div.title = title.trim();
      const dot = document.createElement("span");
      dot.className = "dot " + level; // level 已驗證只會是 green/yellow/red
      div.appendChild(dot);
      div.appendChild(document.createTextNode("資料日 " + m[1] + "/" + m[2]));
      card.appendChild(div);
    });
  } catch (e) {
    /* 渲染階段例外:資料已取得,不當成查詢失敗,靜默略過 */
  }
}

/* ===== 我的異動(批次三 #18) =====
   目的:入口站直接提示「我持有的股票今天有沒有相對明顯的變化」,一眼看完再決定要不要進子站。
   隱私:持股清單只從同 origin localStorage("pm_holdings")(postmkt 寫入,本站唯讀)讀取,
        **絕不放進任何網路請求的 URL、header 或 body**;本節唯一的外部請求是無參數的
        GET raw.githubusercontent.com/.../taiwan-flows/main/data/latest.json(全市場排行,與持股無關)。
   誠實原則:**這不是買賣訊號,只是相對變化提醒**;門檻是顯示用可調常數,無回測依據。
   資料限制:latest.json 只含各榜單前 30 名(ETF 榜前 20),沒進榜的個股在這裡查不到法人買賣超,
        會被歸到「無顯著異動」——這是覆蓋率限制,不代表該檔真的沒有異動。 */
const HOLD_KEY   = "pm_holdings";                       // postmkt 寫入,本站唯讀
const MYCHG_OPEN_KEY = "hub_mychg_open";                // "1" 展開 / "0" 收合(預設展開)
const FLOWS_LATEST_URL = "https://raw.githubusercontent.com/shihpc/taiwan-flows/main/data/latest.json";
const DIAG_URL_BASE = "https://shihpc.github.io/postmkt/#tab=diag&code="; // postmkt hash 路由
/* 顯示門檻(可調常數,非訊號):任一法人淨買賣達 ±MYCHG_LOT_TH 張,或漲跌達 ±MYCHG_CHG_PCT_TH % */
const MYCHG_LOT_TH = 100;      // 張
const MYCHG_CHG_PCT_TH = 3;    // %
const MYCHG_MAX_ROWS = 5;      // 最多列幾檔

/* 標準 HTML 逃逸:所有拼進 innerHTML 的字串(持股代號、latest.json 股名)都要過這裡 */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* 讀本機持股;壞資料一律當成沒有持股(不拋錯) */
function myHoldings(){
  let v;
  try { v = JSON.parse(localStorage.getItem(HOLD_KEY) || "[]"); } catch (e) { return []; }
  if (!Array.isArray(v)) return [];
  const out = [], seen = {};
  v.forEach(h => {
    if (!h || typeof h !== "object") return;
    const c = typeof h.c === "string" ? h.c.trim().toUpperCase() : "";
    if (!c || seen[c]) return;
    seen[c] = 1; out.push(c);
  });
  return out;
}

/* 由 latest.json 建 code → {name, f, t, chg} 索引。
   欄位語意見 taiwan-flows CLAUDE.md:foreign/trust 榜的 net_lots 是該法人當日淨買賣(張),
   sync/oppose 榜同列直接帶 f_net / t_net(張),etf 榜只有金額(千元)不換算張數,只取股名與漲跌%。 */
function myChgIndex(j){
  const idx = {};
  const put = (code, name, key, val) => {
    if (typeof code !== "string" || !code) return;
    const r = idx[code] || (idx[code] = { name: "", f: null, t: null, chg: null });
    if (!r.name && typeof name === "string") r.name = name;
    if (key && typeof val === "number" && isFinite(val) && r[key] == null) r[key] = val;
  };
  const pages = (j && j.pages) || {};
  const eachRow = (page, fn) => {
    const pg = pages[page];
    if (!pg || typeof pg !== "object") return;
    Object.keys(pg).forEach(k => { const arr = pg[k]; if (Array.isArray(arr)) arr.forEach(r => { if (r && typeof r === "object") fn(r); }); });
  };
  eachRow("foreign", r => { put(r.code, r.name, "f", r.net_lots); put(r.code, r.name, "chg", r.chg_pct); });
  eachRow("trust",   r => { put(r.code, r.name, "t", r.net_lots); put(r.code, r.name, "chg", r.chg_pct); });
  ["sync", "oppose"].forEach(p => eachRow(p, r => {
    put(r.code, r.name, "f", r.f_net); put(r.code, r.name, "t", r.t_net); put(r.code, r.name, "chg", r.chg_pct);
  }));
  eachRow("etf", r => { put(r.code, r.name, "chg", r.chg_pct); });
  return idx;
}

/* 是否算「有異動」(純函式,門檻見上方常數) */
function myChgSignificant(r){
  return (r.f != null && Math.abs(r.f) >= MYCHG_LOT_TH) ||
         (r.t != null && Math.abs(r.t) >= MYCHG_LOT_TH) ||
         (r.chg != null && Math.abs(r.chg) >= MYCHG_CHG_PCT_TH);
}

function myChgNum(v, digits){
  if (v == null) return '<span style="color:var(--muted)">—</span>';
  const cls = v > 0 ? "up" : (v < 0 ? "down" : "");
  const txt = (v > 0 ? "+" : "") + v.toFixed(digits);
  return '<span class="' + cls + '">' + esc(txt) + "</span>";
}

async function loadMyChanges(){
  const sec = document.getElementById("mychg");
  const box = document.getElementById("mychgBox");
  const body = document.getElementById("mychgBody");
  const sub = document.getElementById("mychgSub");
  if (!sec || !box || !body) return;

  const codes = myHoldings();
  if (!codes.length) return;            // 無持股:整節維持 hidden,入口與原本一模一樣

  box.open = lsGet(MYCHG_OPEN_KEY) !== "0";   // 預設展開
  box.addEventListener("toggle", () => lsSet(MYCHG_OPEN_KEY, box.open ? "1" : "0"));
  sub.textContent = "持股 " + codes.length + " 檔";
  body.textContent = "載入中…";
  sec.hidden = false;

  let j;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);   // 逾時 8 秒即放棄
    const res = await fetch(FLOWS_LATEST_URL, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("http " + res.status);
    j = await res.json();
    if (!j || typeof j !== "object") throw new Error("shape");
  } catch (e) {
    body.textContent = "無法取得異動資料";   // 不影響五張卡與 /status 狀態列
    return;
  }

  let idx, date;
  try {
    idx = myChgIndex(j);
    date = typeof j.date === "string" ? j.date : "—";
  } catch (e) { body.textContent = "無法取得異動資料"; return; }

  const rows = codes.map(c => {
    const r = idx[c] || { name: "", f: null, t: null, chg: null };
    return { code: c, name: r.name, f: r.f, t: r.t, chg: r.chg };
  });
  const sig = rows.filter(myChgSignificant).sort((a, b) => {
    const m = r => Math.max(Math.abs(r.f || 0), Math.abs(r.t || 0));
    return (m(b) - m(a)) || (Math.abs(b.chg || 0) - Math.abs(a.chg || 0)) || (a.code < b.code ? -1 : 1);
  });
  const shown = sig.slice(0, MYCHG_MAX_ROWS);

  let html = "";
  if (shown.length) {
    html += '<table><thead><tr><th>代號</th><th>名稱</th><th>資料日</th><th>外資(張)</th><th>投信(張)</th><th>漲跌%</th></tr></thead><tbody>';
    shown.forEach(r => {
      html += "<tr>" +
        '<td><a href="' + esc(DIAG_URL_BASE + encodeURIComponent(r.code)) + '" target="_blank" rel="noopener">' + esc(r.code) + "</a></td>" +
        "<td>" + esc(r.name || "—") + "</td>" +
        "<td>" + esc(date) + "</td>" +
        "<td>" + myChgNum(r.f, 1) + "</td>" +
        "<td>" + myChgNum(r.t, 1) + "</td>" +
        "<td>" + myChgNum(r.chg, 2) + "</td>" +
      "</tr>";
    });
    html += "</tbody></table>";
  }

  const quiet = rows.length - sig.length;
  const extra = sig.length - shown.length;
  const notes = [];
  if (quiet > 0) notes.push("其餘 " + quiet + " 檔無顯著異動");
  if (extra > 0) notes.push("另 " + extra + " 檔有異動未列出");
  notes.push("門檻:法人淨買賣 ±" + MYCHG_LOT_TH + " 張或漲跌 ±" + MYCHG_CHG_PCT_TH +
             "%(顯示用可調常數,不是買賣訊號,只是相對變化提醒)");
  html += '<div class="note">' + esc(notes.join(" · ")) + "</div>";
  body.innerHTML = html;
}

/* ===== 啟動:已記住就直接放行,否則掛上密碼門 =====
   (放在最後,確保 renderCards 用到的 PROJECTS 等已初始化) */
if (localStorage.getItem(AUTH_KEY) === PW_HASH || sessionStorage.getItem(AUTH_KEY) === PW_HASH) {
  unlock();
} else {
  document.getElementById("gateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw  = document.getElementById("pw").value;
    const err = document.getElementById("err");
    if (await sha256(pw) === PW_HASH) {
      const store = document.getElementById("remember").checked ? localStorage : sessionStorage;
      store.setItem(AUTH_KEY, PW_HASH);
      unlock();
    } else {
      err.textContent = "密碼錯誤";
      document.getElementById("pw").value = "";
    }
  });
}
</script>
